# Installs bin/euler-jobs, bin/euler-step and bin/euler-resume as commands outside Claude Code: uv tool install git+https://github.com/quadbio/euler-hpc
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "euler-hpc"
description = "Your Slurm jobs and Claude Code sessions on Euler: who submitted what, and who waits for what."
dynamic = ["version"]
requires-python = ">=3.10"
license = "MIT"

[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.shared-scripts]
"bin/euler-jobs" = "euler-jobs"
"bin/euler-step" = "euler-step"
"bin/euler-resume" = "euler-resume"
